name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: Relayer and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check the generated client and the relayer
        run: pnpm --filter @outcome/program-client --filter @outcome/relayer typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: Unit tests with the clock a year ahead
        run: pnpm -r test
        env:
          SHIFT_DAYS: "400"
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/shift-clock.mjs
